name: Panel Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify the version in every file
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          grep -F "var Version = \"${tag}\"" internal/config/config.go
          grep -F "\"version\": \"${tag#v}\"," web/package.json
          for f in README.md docs/i18n/README.fr.md docs/i18n/README.en.md docs/i18n/README.es.md; do
            grep -F "\`${tag}\`" "$f"
          done
          grep -F "## ${tag}" CHANGELOG.md

      - name: Test
        run: make test-ci

      - name: Build release archives
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Check the binary version
        run: |
          set -eu
          tar -xzf dist/dockan-panel-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/dockan-panel/dockan-panel" -version | grep -F "${GITHUB_REF_NAME}"

      - name: Release notes from the changelog
        run: |
          set -eu
          awk -v tag="## ${GITHUB_REF_NAME}" '
            index($0, tag) == 1 { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" \
            --title "Dockan Panel ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/dockan-panel-linux-amd64.tar.gz \
            dist/dockan-panel-linux-arm64.tar.gz \
            dist/SHA256SUMS
