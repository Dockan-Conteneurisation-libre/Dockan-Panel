name: dockan-panel
services:
  web:
    build: .
    image: dockan-panel:latest
    ports:
      - 9090:9090
    env:
      - DOCKAN_BIN=dockan
      - PORT=9090
      - BIND=0.0.0.0
      - PANEL_UPDATE_DIR=/srv/dockan-panel
    volumes:
      - dockan-panel-data:/app/storage
    command: ./dockan-panel
    isolation: none
    restart: always
    healthcheck: CMD-SHELL curl -fsS http://127.0.0.1:9090/api/session >/dev/null
